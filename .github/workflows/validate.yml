name: validate
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install declared YAML parser
        run: python -m pip install -r plugins/cloudrepo-skill-bridge/runtime/requirements.txt
      - run: python -X utf8 tools/validate.py
